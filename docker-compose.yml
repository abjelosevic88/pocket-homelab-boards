# Pocket Boards — boards, lists and cards like Trello / Nextcloud Deck (Go + SQLite). One container, one volume.
services:
  pocket-boards:
    image: ghcr.io/abjelosevic88/pocket-homelab-boards:latest
    container_name: pocket-boards
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The owner's own connections; everything can also be set under Settings.
      TASKS_URL: ${TASKS_URL:-}
      TASKS_TOKEN: ${TASKS_TOKEN:-}
      TIME_URL: ${TIME_URL:-}
      TIME_TOKEN: ${TIME_TOKEN:-}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
